# Azure Pipeline Templates - Step: Build Docker Image

parameters:
  - name: dockerfilePath
    type: string
    default: 'Dockerfile'
  - name: buildContext
    type: string
    default: '.'
  - name: containerRegistry
    type: string
  - name: repository
    type: string
  - name: tags
    type: object
    default:
      - '$(Build.BuildId)'
      - 'latest'
  - name: buildArguments
    type: string
    default: ''

steps:
  - task: Docker@2
    displayName: 'Build Docker Image'
    inputs:
      command: 'build'
      Dockerfile: '${{ parameters.dockerfilePath }}'
      buildContext: '${{ parameters.buildContext }}'
      repository: '${{ parameters.repository }}'
      tags: |
        ${{ join(chr(10), parameters.tags) }}
      arguments: '${{ parameters.buildArguments }}'
      
  - task: Docker@2
    displayName: 'Push Docker Image to Registry'
    inputs:
      command: 'push'
      containerRegistry: '${{ parameters.containerRegistry }}'
      repository: '${{ parameters.repository }}'
      tags: |
        ${{ join(chr(10), parameters.tags) }}
